<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс-лист Самбарс / Барсук / Бизон</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
h1{color:#e94560;margin-bottom:4px}
.subtitle{color:#888;font-size:13px;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters select,.filters input{background:#16213e;border:1px solid #2a3a5c;color:#fff;padding:6px 10px;border-radius:4px;font-size:13px}
.filters label{font-size:12px;color:#888;display:flex;align-items:center;gap:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#16213e;color:#888;padding:8px 10px;text-align:left;position:sticky;top:0;z-index:1}
th.num{text-align:right}
td{padding:6px 10px;border-bottom:1px solid #1a1a3a}
td.num{text-align:right;font-family:monospace}
tr:hover{background:rgba(233,69,96,0.08)}
.brand-barsuk{color:#5dade2}
.brand-sambars{color:#e74c3c}
.brand-bizon{color:#f39c12}
.cost{color:#888}
.retail{color:#f0c040;font-weight:bold}
.margin-good{color:#4caf50}
.margin-ok{color:#ff9800}
.margin-low{color:#e94560}
.stats{display:flex;gap:20px;margin-bottom:12px;font-size:12px;color:#888}
.stats span{color:#e0e0e0;font-weight:bold}
</style>
</head>
<body>
<div style="background:#16213e;padding:5px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid #2a3a5c">
  <a href="portal.html" style="color:#f39c12;text-decoration:none;font-weight:600">← Меню</a>
  <span id="authBadge" style="color:#888"></span>
</div>

<h1>📋 Прайс-лист прицепов</h1>
<p class="subtitle">Сгенерировано из калькулятора cutmap | Цены округлены до 100₽</p>

<div class="stats" id="stats"></div>

<div class="filters">
  <select id="filterBrand" onchange="filter()">
    <option value="">Все бренды</option>
    <option value="Барсук">Барсук</option>
    <option value="Самбарс">Самбарс</option>
    <option value="Бизон">Бизон</option>
  </select>
  <select id="filterKit" onchange="filter()">
    <option value="">Все комплектации</option>
    <option value="4">К4 — Бортовой с тентом</option>
    <option value="3">К3 — Бортовой</option>
    <option value="2">К2 — Рама с полом</option>
    <option value="1">К1 — Рама</option>
  </select>
  <label><input type="checkbox" id="filterAxles1" checked onchange="filter()"> 1 ось</label>
  <label><input type="checkbox" id="filterAxles2" checked onchange="filter()"> 2 оси</label>
  <select id="priceMode" onchange="filter()">
    <option value="retail">Розница</option>
    <option value="wholesale">Опт</option>
    <option value="both">Опт + Розница</option>
  </select>
  <label><input type="checkbox" id="showDetails" checked onchange="filter()"> Себестоимость + маржа</label>
  <button onclick="exportExcel()" style="background:#2ecc71;border:none;color:#111;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px">📥 Экспорт в Excel</button>
</div>

<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>

<script>
// ═══ AUTH ═══
(function(){const a=localStorage.getItem('sambars_auth');if(!a||a!=='director'){window.location.href='portal.html';return;}document.getElementById('authBadge').textContent='👑 Руководитель';})();

let DATA = [];
let _visibleRows = [];

function exportExcel() {
  if (_visibleRows.length === 0) return;
  const priceMode = document.getElementById('priceMode').value;
  const showDetails = document.getElementById('showDetails').checked;
  const isBoth = priceMode === 'both';

  let csv = '\uFEFF';
  csv += 'Модель;Бренд;Осей;Комплектация';
  if (showDetails) csv += ';Себестоимость';
  if (isBoth) {
    csv += ';Розница;Опт';
    if (showDetails) csv += ';Маржа розн. (₽);Маржа розн. (%);Маржа опт (₽);Маржа опт (%)';
  } else {
    csv += ';' + (priceMode === 'retail' ? 'Розница' : 'Опт');
    if (showDetails) csv += ';Маржа (₽);Маржа (%)';
  }
  csv += '\n';

  _visibleRows.forEach(r => {
    csv += `${r.model};${r.brand};${r.axles};${r.kitName}`;
    if (showDetails) csv += `;${r.cost}`;
    if (isBoth) {
      csv += `;${r.retail};${r.wholesale}`;
      if (showDetails) csv += `;${r.marginRetail};${r.marginPctRetail}%;${r.marginWholesale};${r.marginPctWholesale}%`;
    } else {
      csv += `;${priceMode === 'retail' ? r.retail : r.wholesale}`;
      if (showDetails) {
        const margin = priceMode === 'retail' ? r.marginRetail : r.marginWholesale;
        const marginPct = priceMode === 'retail' ? r.marginPctRetail : r.marginPctWholesale;
        csv += `;${margin};${marginPct}%`;
      }
    }
    csv += '\n';
  });

  // Download
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pricelist.csv';
  a.click();
  URL.revokeObjectURL(url);
}

fetch('pricelist.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById('filterKit').value = '';
    filter();
  })
  .catch(err => {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="9" style="color:#e94560;padding:20px">❌ Ошибка загрузки pricelist.json. Запусти gen_pricelist.js для генерации.</td></tr>';
  });

function filter() {
  const brand = document.getElementById('filterBrand').value;
  const kit = document.getElementById('filterKit').value;
  const ax1 = document.getElementById('filterAxles1').checked;
  const ax2 = document.getElementById('filterAxles2').checked;
  
  let rows = DATA;
  if (brand) rows = rows.filter(r => r.brand === brand);
  if (kit) rows = rows.filter(r => r.kit == kit);
  if (!ax1) rows = rows.filter(r => r.axles !== 1);
  if (!ax2) rows = rows.filter(r => r.axles !== 2);
  
  // Sort: brand, w, l, axles, kit
  rows.sort((a,b) => a.num-b.num || a.axles-b.axles || b.kit-a.kit);
  
  _visibleRows = rows;
  render(rows);
}

function marginClass(val) {
  if (val >= 30) return 'margin-good';
  if (val >= 20) return 'margin-ok';
  return 'margin-low';
}

function render(rows) {
  const tbody = document.getElementById('tbody');
  const priceMode = document.getElementById('priceMode').value;
  const showCost = document.getElementById('showDetails').checked;
  const showMargin = document.getElementById('showDetails').checked;

  const isBoth = priceMode === 'both';

  // Update header
  var h = '<tr><th>Модель</th><th>Бренд</th><th>Осей</th><th>Компл.</th>';
  if (showCost) h += '<th class="num cost-col">Себестоимость</th>';
  if (isBoth) {
    h += '<th class="num r-col">Розница</th><th class="num w-col">Опт</th>';
    if (showMargin) h += '<th class="num margin-col r-col">Маржа розн.</th><th class="num margin-col w-col">Маржа опт</th>';
  } else {
    h += '<th class="num price-col">Цена</th>';
    if (showMargin) h += '<th class="num margin-col">Маржа</th>';
  }
  h += '</tr>';
  document.getElementById('thead').innerHTML = h;

  // Column visibility
  document.querySelectorAll('.cost-col').forEach(el => el.style.display = showCost ? '' : 'none');
  document.querySelectorAll('.margin-col').forEach(el => el.style.display = showMargin ? '' : 'none');

  if (rows.length === 0) {
    const cols = 3 + (showCost ? 1 : 0) + 1 + (showMargin ? 1 : 0);
    tbody.innerHTML = `<tr><td colspan="${cols}" style="color:#888;padding:20px;text-align:center">Нет данных по фильтрам</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => {
      const bc = r.brand === 'Барсук' ? 'brand-barsuk' : r.brand === 'Самбарс' ? 'brand-sambars' : 'brand-bizon';
      var row = `<tr><td><b>${r.model}</b></td><td class="${bc}">${r.brand}</td><td>${r.axles}</td><td>${r.kitName}</td>`;
      if (showCost) row += `<td class="num cost">${r.cost.toLocaleString()} ₽</td>`;
      if (isBoth) {
        row += `<td class="num retail">${r.retail.toLocaleString()} ₽</td><td class="num">${r.wholesale.toLocaleString()} ₽</td>`;
        if (showMargin) row += `<td class="num ${marginClass(parseFloat(r.marginPctRetail))}">${r.marginRetail.toLocaleString()} ₽ (${r.marginPctRetail}%)</td><td class="num">${r.marginWholesale.toLocaleString()} ₽ (${r.marginPctWholesale}%)</td>`;
      } else {
        const price = priceMode === 'retail' ? r.retail : r.wholesale;
        const margin = priceMode === 'retail' ? r.marginRetail : r.marginWholesale;
        const marginPct = priceMode === 'retail' ? r.marginPctRetail : r.marginPctWholesale;
        row += `<td class="num retail">${price.toLocaleString()} ₽</td>`;
        if (showMargin) row += `<td class="num ${marginClass(parseFloat(marginPct))}">${margin.toLocaleString()} ₽ (${marginPct}%)</td>`;
      }
      return row + '</tr>';
    }).join('');
  }

  const pm = document.getElementById('priceMode').value;
  var stats = `<span>${rows.length}</span> позиций`;
  if (pm === 'both') {
    stats += ` | Розница сред: <span>${Math.round(rows.reduce((s,r)=>s+r.retail,0)/rows.length).toLocaleString()} ₽</span>`;
    stats += ` | Опт сред: <span>${Math.round(rows.reduce((s,r)=>s+r.wholesale,0)/rows.length).toLocaleString()} ₽</span>`;
  } else {
    const avgPrice = Math.round(rows.reduce((s,r)=>s+(pm==='retail'?r.retail:r.wholesale),0)/rows.length);
    const avgMargin = (rows.reduce((s,r)=>s+parseFloat(pm==='retail'?r.marginPctRetail:r.marginPctWholesale),0)/rows.length).toFixed(1);
    stats += ` | Средняя цена: <span>${avgPrice.toLocaleString()} ₽</span> | Средняя маржа: <span>${avgMargin}%</span>`;
  }
  document.getElementById('stats').innerHTML = stats;
}
</script>
</body>
</html>
