<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1000px; height:1500px; overflow:hidden; }
  body {
    font-family:'DejaVu Sans','Arial',sans-serif;
    background:#0d1524; color:#fff; position:relative;
  }
  .accent { position:absolute; left:0; top:0; bottom:0; width:20px; background:#FF7A00; }

  .wrap {
    position:absolute; inset:0; padding:40px 55px 40px 75px;
    display:flex; flex-direction:column; align-items:center;
  }

  .logo { height:95px; margin-bottom:16px; }

  .photo { width:100%; height:470px; display:flex; align-items:center; justify-content:center; }
  .photo img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }

  .usp { display:flex; flex-direction:column; gap:12px; margin:24px 0; align-self:flex-start; }
  .usp .row { display:flex; align-items:center; gap:16px; }
  .usp .mark { color:#FF7A00; font-size:52px; font-weight:900; line-height:1; }
  .usp .txt { font-size:52px; font-weight:800; color:#fff; line-height:1; }

  .arrow { display:flex; align-items:center; gap:20px; margin:10px 0 20px; }
  .arrow .word { font-size:76px; font-weight:900; color:#FF7A00; line-height:1; }
  .arrow svg { display:block; }

  .contact { width:100%; display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:auto; }
  .addr { font-size:46px; font-weight:700; color:#fff; }
  .phone { font-size:80px; font-weight:900; color:#FF7A00; line-height:1.05; }
  .qrrow { display:flex; align-items:center; gap:18px; margin-top:6px; }
  .qrrow .qbox { background:#fff; border-radius:10px; padding:8px; }
  .qrrow img { width:150px; height:150px; display:block; }
  .qrrow .site { font-size:50px; font-weight:800; color:#fff; }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="wrap">
    <img class="logo" src="logo_final.png">

    <div class="photo"><img src="camo.jpg"></div>

    <div class="usp">
      <div class="row"><span class="mark">✓</span><span class="txt">Сварные · оцинкованные</span></div>
      <div class="row"><span class="mark">✓</span><span class="txt">Больших размеров</span></div>
    </div>

    <div class="arrow" id="arrowbox">
      <span class="word">ПРОИЗВОДСТВО</span>
      <svg id="arrowsvg" width="180" height="76" viewBox="0 0 180 76"></svg>
    </div>

    <div class="contact">
      <div class="addr">ул. Камышинская 20А</div>
      <div class="phone">+7 927 619-32-20</div>
      <div class="qrrow">
        <div class="qbox"><img src="qr_site.png"></div>
        <span class="site">sambars.ru</span>
      </div>
    </div>
  </div>

  <script>
    const dir = new URLSearchParams(location.search).get('dir') || 'right';
    const svg = document.getElementById('arrowsvg');
    const box = document.getElementById('arrowbox');
    const word = box.querySelector('.word');
    const C = '#FF7A00';
    if (dir === 'left') {
      // стрелка налево, текст справа
      svg.innerHTML = '<polygon points="20,38 60,10 60,28 180,28 180,48 60,48 60,66" fill="'+C+'"/>';
      box.insertBefore(svg, word);
    } else {
      svg.innerHTML = '<polygon points="160,38 120,10 120,28 0,28 0,48 120,48 120,66" fill="'+C+'"/>';
    }
  </script>
</body>
</html>
