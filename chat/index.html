<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Васян — чат</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;height:100dvh;display:flex;flex-direction:column}
.header{background:#16213e;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0f3460}
.header .avatar{width:36px;height:36px;background:#e94560;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.header .title{font-weight:600;font-size:16px}
.header .status{font-size:11px;color:#888}
.header .status.online{color:#4ecca3}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#0f3460;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#16213e;border-bottom-left-radius:4px}
.msg .time{font-size:10px;color:#888;margin-top:4px}
.msg pre{background:#0a0a1a;padding:8px;border-radius:6px;overflow-x:auto;font-size:12px;margin:6px 0}
.msg code{font-size:12px;background:#0a0a1a;padding:1px 4px;border-radius:3px}
.input-area{display:flex;padding:10px;gap:8px;background:#16213e;border-top:1px solid #0f3460}
.input-area textarea{flex:1;background:#1a1a2e;border:1px solid #0f3460;border-radius:12px;padding:10px 14px;color:#e0e0e0;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit}
.input-area textarea:focus{outline:none;border-color:#e94560}
.input-area button{background:#e94560;color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.input-area button:disabled{opacity:.5}
.connecting{text-align:center;padding:40px;color:#888}
.connecting .spinner{display:inline-block;width:24px;height:24px;border:3px solid #333;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.setup{max-width:400px;margin:40px auto;padding:24px;background:#16213e;border-radius:16px}
.setup h2{margin-bottom:16px;color:#e94560}
.setup input{width:100%;background:#1a1a2e;border:1px solid #0f3460;padding:10px 14px;border-radius:8px;color:#e0e0e0;font-size:14px;margin-bottom:12px}
.setup button{width:100%;background:#e94560;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.setup .hint{font-size:11px;color:#888;margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <div class="avatar">🔧</div>
  <div>
    <div class="title">Васян</div>
    <div class="status" id="status">подключение...</div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="connecting">
    <div class="spinner"></div>
    <div>Подключаюсь к шлюзу...</div>
  </div>
</div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="Напиши Васяну..." disabled></textarea>
  <button id="sendBtn" disabled>➤</button>
</div>

<div class="setup" id="setup" style="display:none">
  <h2>⚙️ Настройка подключения</h2>
  <input type="text" id="gatewayUrl" placeholder="ws://201.51.5.246:18789" value="ws://201.51.5.246:18789">
  <button onclick="connect()">Подключиться</button>
  <div class="hint">Если не подключается — проверь адрес шлюза</div>
</div>

<script>
const GATEWAY = 'ws://201.51.5.246:18789';
let ws = null;
let sessionId = null;
let messagesEl = document.getElementById('messages');
let inputEl = document.getElementById('input');
let sendBtn = document.getElementById('sendBtn');
let statusEl = document.getElementById('status');
let setupEl = document.getElementById('setup');

function setStatus(text, online) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (online ? ' online' : '');
}

function addMessage(text, role) {
  let div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.innerHTML = text.replace(/\n/g, '<br>') + '<div class="time">' + new Date().toLocaleTimeString() + '</div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showConnecting() {
  messagesEl.innerHTML = '<div class="connecting"><div class="spinner"></div><div>Подключаюсь...</div></div>';
}

async function connect() {
  const gw = document.getElementById('gatewayUrl')?.value || GATEWAY;
  
  try {
    ws = new WebSocket(gw);
    
    ws.onopen = async () => {
      setStatus('онлайн', true);
      setupEl.style.display = 'none';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      
      // Load history
      try {
        ws.send(JSON.stringify({type:'chat.history', maxChars:50000}));
      } catch(e) {}
    };
    
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'chat.history' || msg.type === 'chat.history.result') {
          sessionId = msg.sessionId;
          messagesEl.innerHTML = '';
          const entries = msg.entries || msg.messages || [];
          for (const entry of entries) {
            if (entry.role === 'user') addMessage(entry.text || entry.content || '', 'user');
            else if (entry.role === 'assistant') addMessage(entry.text || entry.content || '', 'bot');
          }
          if (entries.length === 0) {
            messagesEl.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Привет! Я Васян 🔧<br>Цифровой кореш Олега. О чём поговорим?</div>';
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        else if (msg.type === 'chat.reply' || msg.type === 'reply') {
          addMessage(msg.text || msg.content || '', 'bot');
        }
        else if (msg.type === 'error') {
          addMessage('⚠️ ' + (msg.error || 'Ошибка'), 'bot');
        }
      } catch(e) {
        // non-JSON message, ignore
      }
    };
    
    ws.onclose = () => {
      setStatus('отключён', false);
      inputEl.disabled = true;
      sendBtn.disabled = true;
      setupEl.style.display = 'block';
    };
    
    ws.onerror = () => {
      setStatus('ошибка подключения', false);
      setupEl.style.display = 'block';
      showConnecting();
    };
    
  } catch(e) {
    setStatus('недоступен', false);
    setupEl.style.display = 'block';
  }
}

function send() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  
  addMessage(text, 'user');
  inputEl.value = '';
  inputEl.style.height = 'auto';
  
  ws.send(JSON.stringify({
    type: 'chat.send',
    sessionId: sessionId,
    message: text
  }));
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Auto-connect
connect();
</script>
</body>
</html>
