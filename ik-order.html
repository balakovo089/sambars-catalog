<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ ИК-4 — Сварка прицепов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
h1{color:#e94560;font-size:22px;margin-bottom:4px}
h2{color:#e94560;font-size:16px;margin:16px 0 8px}
h3{color:#f39c12;font-size:14px;margin:12px 0 6px}
.section{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:14px 18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:#888;white-space:nowrap}
.row input,.row select{background:#16213e;border:1px solid #2a3a5c;color:#fff;padding:6px 10px;border-radius:4px;font-size:13px}
.row input[type=number]{width:80px;text-align:right}
.row input[type=date]{width:140px}
.btn{padding:6px 14px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-add{background:#2ecc71;color:#111}
.btn-del{background:#c0392b;color:#fff;padding:2px 8px;font-size:11px}
.btn-export{background:#5dade2;color:#111}
.btn-pdf{background:#e67e22;color:#111}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{background:#16213e;color:#888;padding:6px 10px;text-align:left}
th.num{text-align:right}
td{padding:5px 10px;border-bottom:1px solid #1a1a3a}
td.num{text-align:right;font-family:monospace}
td.num.bold{font-weight:bold;color:#f0c040}
.total-row td{border-top:2px solid #e94560;font-weight:bold}
.sub{color:#888;font-size:11px}
.chk-group{display:flex;flex-wrap:wrap;gap:12px}
.chk-group label{font-size:13px;color:#ccc;display:flex;align-items:center;gap:5px;cursor:pointer}
.pos-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1e293b}
.pos-item span{flex:1;font-size:13px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media print{
  body{background:#fff;color:#000;padding:10px;font-size:11px}
  .section{background:#fff;border:1px solid #ccc;break-inside:avoid}
  h1,h2,h3{color:#000}
  .btn,.btn-add,.btn-del,.btn-export,.btn-pdf,.row:first-child{display:none}
  input,select{border:none;background:transparent;color:#000;-webkit-appearance:none}
  table{font-size:10px}
  th{background:#eee;color:#000}
  td.num.bold,.total-row td{color:#000}
}
</style>
</head>
<body>
<!-- NAV BAR -->
<div style="background:#16213e;padding:5px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid #2a3a5c">
  <a href="portal.html" style="color:#f39c12;text-decoration:none;font-weight:600">← Меню</a>
  <span id="authBadge" style="color:#888"></span>
</div>

<h1>🔩 Заказ на сварку — ИК-4</h1>

<!-- META -->
<div class="section">
<div class="row">
  <label>Заказ №</label><input type="text" id="orderNum" value="1" style="width:60px">
  <label>от</label><input type="date" id="orderDate">
  <label>Срок</label><input type="date" id="orderDeadline">
  <label style="margin-left:16px">Ставка нормо-часа</label>
  <input type="number" id="zpRate" value="200" style="width:80px"><label>₽/ч</label>
</div>
</div>

<!-- POSITIONS -->
<div class="section">
<h2>📋 Позиции заказа</h2>
<div class="row">
  <select id="modelSelect"></select>
  <select id="kitSelect">
    <option value="4">К4 — Бортовой с тентом</option>
    <option value="3">К3 — Бортовой</option>
    <option value="2">К2 — Рама с полом</option>
    <option value="1">К1 — Рама</option>
  </select>
  <label>Осей:</label><select id="axleSelect"></select>
  <label>Кол-во:</label><input type="number" id="posQty" value="1" min="1" style="width:60px">
  <button class="btn btn-add" onclick="addPosition()">+ Добавить</button>
</div>
<div id="posList"></div>
</div>

<!-- OPERATIONS -->
<div class="section">
<h2>⚙️ Операции</h2>
<div class="chk-group">
  <label><input type="checkbox" id="opFrame" checked onchange="recalc()"> Рама + дышло</label>
  <label><input type="checkbox" id="opSides" checked onchange="recalc()"> Борта</label>
  <label><input type="checkbox" id="opTentFrame" checked onchange="recalc()"> Каркас тента</label>
  <label><input type="checkbox" id="opAxles" checked onchange="recalc()"> Оси</label>
  <label><input type="checkbox" id="opTent" checked onchange="recalc()"> Тент (ткань+фурнитура)</label>
</div>
</div>

<!-- RESULTS -->
<div id="results" style="display:none">
<h2>📊 Спецификация</h2>
<div class="summary-grid">
<div class="section">
<h3>🔩 Раскрой металла</h3>
<div id="metalTable"></div>
</div>
<div class="section">
<h3>🧤 Расходники</h3>
<div id="consTable"></div>
</div>
</div>
<div class="summary-grid">
<div class="section">
<h3>🔩 Кронштейны (без крыльевых)</h3>
<div id="bracketTable"></div>
</div>
<div class="section">
<h3>💰 ЗП (сварка)</h3>
<div id="zpTable"></div>
<div id="zpTotal" style="text-align:right;font-size:15px;font-weight:bold;color:#f0c040;margin-top:8px"></div>
</div>
<div class="section" id="tentSection" style="display:none">
<h3>🏕️ Тенты</h3>
<div id="tentTable"></div>
</div>
</div>
<div class="section" style="text-align:right">
  <span style="font-size:18px;font-weight:bold;color:#e94560" id="grandTotal"></span>
</div>
<div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px">
  <button class="btn btn-export" onclick="exportCSV()">📥 Excel (CSV)</button>
  <button class="btn btn-pdf" onclick="generateBlank()">📄 Бланк ИК</button>
  <button class="btn btn-pdf" onclick="window.print()">🖨️ PDF</button>
</div>
</div>

<script>
// ═══ AUTH CHECK ═══
(function(){const a=localStorage.getItem('sambars_auth');if(!a){window.location.href='portal.html';return;}document.getElementById('authBadge').textContent=a==='director'?'👑 Руководитель':'👤 ИК-4';})();
// ═══ DATA (from cutmap) ═══
const CATALOG = [
  {num:1,brand:"Барсук",model:"Барсук 1.25×2.0",w:1250,l:2000,tent:50,ax:[1]},
  {num:2,brand:"Барсук",model:"Барсук 1.25×2.5",w:1250,l:2500,tent:70,ax:[1,2]},
  {num:3,brand:"Барсук",model:"Барсук 1.25×3.0",w:1250,l:3000,tent:120,ax:[1,2]},
  {num:4,brand:"Барсук",model:"Барсук 1.5×2.5",w:1500,l:2500,tent:70,ax:[1,2]},
  {num:5,brand:"Барсук",model:"Барсук 1.5×3.0",w:1500,l:3000,tent:120,ax:[1,2]},
  {num:6,brand:"Барсук",model:"Барсук 1.5×3.5",w:1500,l:3500,tent:120,ax:[1,2]},
  {num:7,brand:"Самбарс",model:"Самбарс 1.25×2.0",w:1250,l:2000,tent:70,ax:[1]},
  {num:8,brand:"Самбарс",model:"Самбарс 1.25×2.5",w:1250,l:2500,tent:120,ax:[1,2]},
  {num:9,brand:"Самбарс",model:"Самбарс 1.25×3.0",w:1250,l:3000,tent:120,ax:[1,2]},
  {num:10,brand:"Самбарс",model:"Самбарс 1.5×2.5",w:1500,l:2500,tent:120,ax:[1,2]},
  {num:11,brand:"Самбарс",model:"Самбарс 1.5×3.0",w:1500,l:3000,tent:120,ax:[1,2]},
  {num:12,brand:"Самбарс",model:"Самбарс 1.5×3.5",w:1500,l:3500,tent:120,ax:[1,2]},
  {num:13,brand:"Самбарс",model:"Самбарс 1.7×3.0",w:1700,l:3000,tent:140,ax:[1,2]},
  {num:14,brand:"Самбарс",model:"Самбарс 1.7×3.5",w:1700,l:3500,tent:140,ax:[1,2]},
  {num:15,brand:"Самбарс",model:"Самбарс 1.7×4.0",w:1700,l:4000,tent:140,ax:[1,2]},
  {num:16,brand:"Самбарс",model:"Самбарс 2.0×3.5",w:2000,l:3500,tent:170,ax:[1,2]},
  {num:17,brand:"Самбарс",model:"Самбарс 2.0×4.0",w:2000,l:4000,tent:170,ax:[1,2]},
  {num:18,brand:"Самбарс",model:"Самбарс 2.0×4.5",w:2000,l:4500,tent:170,ax:[1,2]},
  {num:19,brand:"Бизон",model:"Бизон 2.0×3.5",w:2000,l:3500,tent:170,ax:[2]},
  {num:20,brand:"Бизон",model:"Бизон 2.0×4.0",w:2000,l:4000,tent:170,ax:[2]}
];

const BRAND = {
  'Барсук':{frameProfile:'60×40×2',extraMM:60,sideProfile:'20×20×1.5',sideThick:30,boardH:300,
    drawbarProfile:'60×40×2',axleProfile:'50×50×3',springs:3,
    tentPVC:'ПВХ 500 г/м2',espander:6,rate:400,wheelsPrice:3650,springsPrice:1190,hubPrice:1250,
    tentPVC_price:120},
  'Самбарс':{frameProfile:'60×60×2',extraMM:70,sideProfile:'25×25×2',sideThick:35,boardH:300,
    drawbarProfile:'80×40×3',axleProfile:'50×50×4',springs:5,
    tentPVC:'ПВХ 650 г/м2',espander:8,rate:500,wheelsPrice:3555,springsPrice:1302.56,hubPrice:1250,
    tentPVC_price:176.78},
  'Бизон':{frameProfile:'60×60×2',extraMM:70,sideProfile:'25×25×2',sideThick:35,boardH:300,
    drawbarProfile:'80×40×3',axleProfile:'50×50×4',springs:7,
    tentPVC:'ПВХ 650 г/м2',espander:8,rate:500,wheelsPrice:3555,springsPrice:2395,hubPrice:1250,
    tentPVC_price:176.78}
};

const TUBES = {
  '60×40×2':{mass:2.93,price:205},'60×60×2':{mass:3.56,price:226},
  '40×20×2':{mass:1.35,price:96},'80×40×3':{mass:5.19,price:326},
  '50×50×3':{mass:4.30,price:268},'50×50×4':{mass:5.60,price:346},
  '25×25×2':{mass:1.40,price:76},'20×20×1.5':{mass:0.84,price:60}
};

// ═══ BRACKET PRICES ═══
const BRACKET_PRICES = {
  'Кронштейн рессоры':115,'Кронштейн амортизатора':85,'Кронштейн крыла':65,
  'Косынка усиления':30,'Пластина дышла':75,'Пластина рамы':75,
  'Пластина под номер':50,'Кронштейн подфарника':30
};

// ═══ STATE ═══
let positions = []; // [{catIdx, kit, axles, qty}]

// ═══ INIT ═══
const modelSel = document.getElementById('modelSelect');
CATALOG.forEach((m,i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `#${m.num} ${m.model}`;
  modelSel.appendChild(opt);
});
modelSel.value = '10';
onModelSelect();
modelSel.onchange = onModelSelect;

document.getElementById('orderDate').valueAsDate = new Date();
const dl = new Date(); dl.setDate(dl.getDate()+14);
document.getElementById('orderDeadline').valueAsDate = dl;

function onModelSelect(){
  const idx = parseInt(modelSel.value);
  const m = CATALOG[idx];
  const axSel = document.getElementById('axleSelect');
  axSel.innerHTML = '';
  m.ax.forEach(a => { const o=document.createElement('option');o.value=a;o.textContent=a;axSel.appendChild(o); });
  axSel.value = m.ax[0];
}

// ═══ POSITIONS ═══
function addPosition(){
  const catIdx = parseInt(modelSel.value);
  const kit = parseInt(document.getElementById('kitSelect').value);
  const axles = parseInt(document.getElementById('axleSelect').value);
  const qty = parseInt(document.getElementById('posQty').value) || 1;
  positions.push({catIdx,kit,axles,qty});
  renderPositions();
  recalc();
}

function removePosition(i){ positions.splice(i,1); renderPositions(); recalc(); }

function renderPositions(){
  const el = document.getElementById('posList');
  if(!positions.length){ el.innerHTML='<div class="sub">Нет позиций. Добавьте модель выше.</div>'; return; }
  el.innerHTML = positions.map((p,i)=>{
    const m = CATALOG[p.catIdx];
    const kn = ['','Рама','Рама с полом','Бортовой','Бортовой с тентом'][p.kit];
    return `<div class="pos-item">
      <span><b>${m.model}</b> — ${kn} — ${p.axles} ось(и) — <b>×${p.qty} шт</b></span>
      <button class="btn btn-del" onclick="removePosition(${i})">✕</button></div>`;
  }).join('');
}

// ═══ CALC ═══
function calcStep(total,divisor){const n=Math.max(1,Math.round(total/divisor));return{n,step:total/n};}

function calcProfilePieces(m,bp,axles,kit){
  const frameW=m.w+bp.extraMM, frameL=m.l+bp.extraMM;
  const fp = bp.frameProfile, dp = bp.drawbarProfile;
  const crossStep = calcStep(frameL/1000,0.6);
  const totalCross = crossStep.n;
  const fpCrossHalf = frameW/2000;
  const fpCross = frameW/1000;

  const pieces = {}; // prof → meters

  const add = (prof,meters)=>{ pieces[prof] = (pieces[prof]||0)+meters; };

  if(document.getElementById('opFrame').checked){
    // Frame
    const centerM = bp.frameProfile==='60×60×2' ? frameL/1000 : 0;
    add(fp, frameL/1000*2 + frameW/1000*2 + centerM);
    // Crossbars
    add('40×20×2', totalCross * (bp.frameProfile==='60×60×2'?fpCrossHalf*2:fpCross));
    // Drawbar
    add(dp, 5.2);
  }

  if(document.getElementById('opSides').checked && kit>=3){
    const sideStep = calcStep(frameL/1000,0.8);
    const totalJumpers = sideStep.n;
    const sideL = frameL/1000*2 + frameW/1000*2;
    const jumperM = totalJumpers * bp.boardH/1000;
    add(bp.sideProfile, sideL + jumperM);
  }

  if(document.getElementById('opTentFrame').checked && kit>=4 && m.tent>0){
    const tentMM = m.tent*10;
    const totalFrameH = (bp.boardH + tentMM)/1000;
    const archCount = Math.max(1,Math.round(frameL/700));
    // Side frames: 4 rails × frameL/1000
    add('20×20×1.5', frameL/1000*4 + archCount*totalFrameH + archCount*(frameW+240)/1000);
    // Spacers
    add('25×25×2', archCount*2*0.10);
  }

  if(document.getElementById('opAxles').checked){
    add(bp.axleProfile, axles*(frameW+200)/1000);
    // Axle connector bar
    if(bp.frameProfile==='60×60×2') add(fp, axles*frameW/1000);
    else add(fp, axles*fpCrossHalf*2);
  }

  return pieces;
}

function recalc(){
  if(!positions.length){ document.getElementById('results').style.display='none'; return; }
  document.getElementById('results').style.display='block';

  const rate = parseInt(document.getElementById('zpRate').value)||150;

  // Aggregate profiles
  const aggPieces = {};
  let totalCuts = 0, totalZpMin = 0;
  let zpPerModel = [];
  let linearM500 = 0, linearM650 = 0, tentHardware = {};

  const addTentHW = (name,qty)=>{ tentHardware[name] = (tentHardware[name]||0)+qty; };

  positions.forEach(pos=>{
    const m = CATALOG[pos.catIdx];
    const bp = BRAND[m.brand];
    const axles = pos.axles;
    const kit = pos.kit;
    const qty = pos.qty;

    // Profiles
    const profPieces = calcProfilePieces(m,bp,axles,kit);
    for(const [prof,meters] of Object.entries(profPieces)){
      aggPieces[prof] = (aggPieces[prof]||0) + meters*qty;
    }

    // ZP calculations — по модели
    const opMins = calcZPMinutes(m,bp,axles,kit);
    const modelOps = Object.entries(opMins).map(([op,min])=>({op,min}));
    const tentMins = calcTentMins(m, bp, kit);
    if(tentMins > 0) modelOps.push({op:'Изготовление тента (тентовик)', min:tentMins});
    modelOps.forEach(o=>{ totalZpMin += o.min*qty; });
    zpPerModel.push({model:m.model, kit, axles, qty, ops:modelOps});

    // Cuts = 1 cut per piece per model (rough)
    const proCount = Object.values(profPieces).reduce((s,v)=>s+v,0)*0.15; // ~cuts per meter
    totalCuts += Math.round(proCount*qty);

    // Tent — linear meters from roll strips
    if(document.getElementById('opTent').checked && kit>=4 && m.tent>0){
      const tmm = m.tent*10;
      const fw = m.w+bp.extraMM, fl = m.l+bp.extraMM;
      const is650 = bp.tentPVC_price > 150; // 650g fabric
      const rollW = 2500; // both 500g and 650g: 2.5m rolls
      const strips = Math.ceil((fw + 2*tmm + 440) / rollW);
      const linearM = strips * fl / 1000; // погонные метры
      if(is650) linearM650 += linearM*qty; else linearM500 += linearM*qty;
      // Hardware (needs area, not linear)
      const ta = ((fw+2*tmm)/1000)*(fl/1000)*1.15;
      // Hardware
      const lowerP = 2*(fw/1000+fl/1000)+0.2;
      const espM = (lowerP+0.5)*qty;
      const luv = Math.ceil(ta/3)*qty;
      const fW = (fw+2*tmm)/1000;
      const fbc = Math.max(2,Math.round(fW/0.3)+1);
      const espName = bp.espander===8?'Эспандер d8мм':'Эспандер d6мм';
      addTentHW(espName,espM);
      addTentHW('Люверсы d10',luv);
      addTentHW('Заклёпки 4.8×12',luv*3);
      if(m.brand==='Барсук'){
        addTentHW('Скобы + ремни (Барсук)',fbc*11*qty);
        addTentHW('Ремень стяжной',(tmm/1000)*2*24*qty);
      } else {
        addTentHW('Поворотки d37',fbc*2*qty);
        addTentHW('Подкладки d32',fbc*2*qty);
      }
    }
  });

  // Metal table
  let metalHTML = '<table><tr><th>Профиль</th><th class="num">Метров</th><th class="num">Цена/м</th><th class="num">Хлыстов 6м</th><th class="num">Вес, кг</th><th class="num">Стоимость</th></tr>';
  let totalWeight = 0, totalMetalCost = 0;
  const sortedProf = Object.entries(aggPieces).sort((a,b)=>b[1]-a[1]);
  sortedProf.forEach(([prof,m])=>{
    const rods = Math.ceil(m*1.10/6);
    const mass = (TUBES[prof]?TUBES[prof].mass:0)*m;
    const price = TUBES[prof]?TUBES[prof].price:0;
    const cost = Math.round(m*price);
    totalWeight += mass;
    totalMetalCost += cost;
    metalHTML += `<tr><td>${prof}</td><td class="num">${m.toFixed(1)}</td><td class="num">${price}</td><td class="num">${rods}</td><td class="num">${mass.toFixed(1)}</td><td class="num">${cost.toLocaleString()} ₽</td></tr>`;
  });
  metalHTML += `<tr class="total-row"><td>ИТОГО</td><td class="num"></td><td class="num"></td><td class="num"></td><td class="num">${totalWeight.toFixed(1)} кг</td><td class="num">${totalMetalCost.toLocaleString()} ₽</td></tr></table>`;
  document.getElementById('metalTable').innerHTML = metalHTML;

  // Consumables
  const wire = (totalCuts*0.007).toFixed(2);
  const gas = (totalCuts*0.007).toFixed(2);
  const cutDiscs = Math.ceil(totalCuts/18);
  const grindDiscs = Math.ceil(totalCuts/55);
  const gloves = Math.max(1,Math.ceil(totalCuts/100));
  const kragi = Math.max(1,Math.ceil(totalCuts/200));
  const consPrices = {wire:250,gas:43,cutDisc:13,grindDisc:44,gloves:25,kragi:420};
  const consCost = Math.round(wire*consPrices.wire + gas*consPrices.gas + cutDiscs*consPrices.cutDisc + grindDiscs*consPrices.grindDisc + gloves*consPrices.gloves + kragi*consPrices.kragi);
  document.getElementById('consTable').innerHTML = `<table>
    <tr><th>Расходник</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Стоимость</th></tr>
    <tr><td>Проволока 0.8 мм</td><td class="num">${wire} кг</td><td class="num">${consPrices.wire} ₽/кг</td><td class="num">${Math.round(wire*consPrices.wire)} ₽</td></tr>
    <tr><td>Газ пропан</td><td class="num">${gas} кг</td><td class="num">${consPrices.gas} ₽/кг</td><td class="num">${Math.round(gas*consPrices.gas)} ₽</td></tr>
    <tr><td>Диски отрезные 125</td><td class="num">${cutDiscs} шт</td><td class="num">${consPrices.cutDisc} ₽</td><td class="num">${cutDiscs*consPrices.cutDisc} ₽</td></tr>
    <tr><td>Диски лепестковые</td><td class="num">${grindDiscs} шт</td><td class="num">${consPrices.grindDisc} ₽</td><td class="num">${grindDiscs*consPrices.grindDisc} ₽</td></tr>
    <tr><td>Перчатки</td><td class="num">${gloves} пар</td><td class="num">${consPrices.gloves} ₽</td><td class="num">${gloves*consPrices.gloves} ₽</td></tr>
    <tr><td>Краги сварочные</td><td class="num">${kragi} пар</td><td class="num">${consPrices.kragi} ₽</td><td class="num">${kragi*consPrices.kragi} ₽</td></tr>
    <tr class="total-row"><td>ИТОГО</td><td class="num"></td><td class="num"></td><td class="num">${consCost.toLocaleString()} ₽</td></tr>
  </table>`;

  // Brackets (all except wing brackets)

  }

  window._blank = {
    zpPerModel, aggPieces, totalWeight, rate, totalZpMin, zpTotal,
    cons: {wire, gas, cutDiscs, grindDiscs, gloves, kragi, consCost, consPrices}

}

function calcZPMinutes(m,bp,axles,kit){
  const result = {};
  const L = m.l, W = m.w, brand = m.brand;
  const extraMM = bp.extraMM;
  const frameW = W+extraMM, frameL = L+extraMM;

  // База (2.0×1.25, 1 ось) и шаг на +0.5м длины — из таблицы ЗП
  // индексы: 0-распил рамы,1-сварка рамы,2-распил бортов,3-сварка бортов,4-сварка оси,5-распил каркаса,6-сварка каркаса
  const baseS=[35,220,30,120,60,40,160];
  const baseB=[25,190,30,120,60,40,160];
  const stepS=[10,20,5,0,0,5,10];
  const stepB=[10,10,5,0,0,5,10];
  const base = brand==='Барсук'?baseB:baseS;
  const step = brand==='Барсук'?stepB:stepS;
  const lenSteps = (L-2000)/500;

  // Надбавка ширины: распил рамы (0), сварка рамы (1)
  let w0=0, w1=0;
  if(brand==='Самбарс'){
    if(W<=1250){w0=0;w1=0;}
    else if(W<=1500){w0=15;w1=20;}
    else if(W<=1700){w0=25;w1=35;}
    else{w0=40;w1=55;}
  }
  // Надбавка 2-й оси: сварка оси (4) +60
  const axle2 = (axles===2)?60:0;

  // Op minutes
  const mins = base.map((b,i)=>{
    let v = b + step[i]*lenSteps;
    if(i===0) v+=w0;
    if(i===1) v+=w1;
    if(i===4) v+=axle2;
    return Math.round(v);
  });

  const ops = document.getElementById('opFrame');
  const sides = document.getElementById('opSides');
  const tf = document.getElementById('opTentFrame');
  const ax = document.getElementById('opAxles');

  if(ops.checked){ result['Распил рамы+дышла']=mins[0]; result['Сварка рамы+дышла']=mins[1]; }
  if(sides.checked&&kit>=3){ result['Распил бортов']=mins[2]; result['Сварка бортов']=mins[3]; }
  if(ax.checked){ result['Сварка оси']=mins[4]; }
  if(tf.checked&&kit>=4&&m.tent>0){
    result['Распил каркаса тента']=mins[5];
    result['Сварка каркаса тента']=mins[6];
  }

  return result;
}

function calcTentMins(m, bp, kit){
  if(kit < 4 || !m.tent || m.tent <= 0) return 0;
  if(!document.getElementById('opTent').checked) return 0;
  const W = m.w, L = m.l, brand = m.brand;
  const tentMM = m.tent * 10;
  const frameW = W + bp.extraMM, frameL = L + bp.extraMM;
  const aero = m.tent >= 120;
  const tentArea = Math.round(((frameW+2*tentMM)/1000)*(frameL/1000)*1.15*10)/10;
  const reinfM = Math.round(2*(frameL+380)/1000*10)/10;
  const corners = aero ? 6 : 4;
  const louv = brand==='Барсук' ? (W<=1250?24:26) : (W<=1250?26:W<=1500?28:W<=1700?32:36);
  const valves = brand==='Барсук' ? 12 : (W<=1250?26:W<=1500?28:W<=1700?30:34);
  // сделка (₽) → нормо-минуты (эталон через ставку цеха bp.rate): расценки 100/50/150/10/30 ₽
  const cost = tentArea*100 + reinfM*50 + corners*150 + louv*10 + valves*30;
  return Math.round(cost * 60 / bp.rate);
}
